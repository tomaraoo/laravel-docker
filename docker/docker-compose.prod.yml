# ===========================================================================
# Laravel PRODUCTION Compose (MOUNT approach)
#
# Credentials and settings are read from the production host's .env file on disk.
# Zero application code and zero secrets are baked into the container image.
# ===========================================================================
services:
  app:
    image: ${COMPOSE_PROJECT_NAME:-laravel-app}:php85
    build:
      context: ${LARAVEL_DOCKER_CONTEXT:-.}
      dockerfile: Dockerfile
      args:
        HOST_UID: "${HOST_UID:-48}"
        HOST_GID: "${HOST_GID:-48}"
        HOST_EXTRA_GID: "${HOST_EXTRA_GID:-48}"
    container_name: ${COMPOSE_PROJECT_NAME:-laravel-app}
    restart: unless-stopped
    ports:
      - "${DOCKER_APP_PORT:-80}:80"
    volumes:
      - ${APP_CODE_PATH:-.}:/app${DOCKER_VOLUME_SELINUX_SUFFIX:-:z}
    environment:
      PHP_USER_ID: "${HOST_UID:-48}"
      PHP_GROUP_ID: "${HOST_GID:-48}"
    extra_hosts: []
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
