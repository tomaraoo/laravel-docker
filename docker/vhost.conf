# ===========================================================================
# Laravel Runtime Apache VirtualHost (:80)
# — PHP 8.5 / PHP2Shell upload remediation & web-shell defense-in-depth.
#
# TLS is terminated UPSTREAM (CloudFront, ALB, Nginx, or local dev browser).
# The container speaks plain HTTP on :80 only and serves any Host header.
# ===========================================================================

ServerName localhost

# --- Limit request body size (64 MiB PHP2Shell upload mitigation headroom)
LimitRequestBody 67108864

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /app/public

    <Directory /app/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php

        RewriteEngine On

        # Preserve Authorization header for Laravel Sanctum / Passport / Bearer APIs
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

        # Preserve X-XSRF-Token header for SPA CSRF protection
        RewriteCond %{HTTP:x-xsrf-token} .
        RewriteRule .* - [E=HTTP_X_XSRF_TOKEN:%{HTTP:X-XSRF-Token}]

        # Redirect trailing slashes if not a directory
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} (.+)/$
        RewriteRule ^ %1 [L,R=301]

        # Route requests to Laravel front controller
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>
</VirtualHost>

# ===========================================================================
# UPLOAD HARDENING (web-shell defense-in-depth) — applies to ALL requests.
# Covers both symlinked `public/storage` -> `storage/app/public` and `public/uploads`.
# ===========================================================================

<Directory /app/public/storage>
    AllowOverride None
    Options -Indexes -ExecCGI
    <IfModule php_module>
        php_admin_flag engine off
    </IfModule>
    RemoveHandler .php .phtml .php3 .php4 .php5 .php7 .php8 .phps .pht .phar
    RemoveType .php .phtml .php3 .php4 .php5 .php7 .php8 .phps .pht .phar
    <FilesMatch "\.(php|phtml|php[0-9]|phps|pht|phar)$">
        SetHandler none
        ForceType text/plain
        Require all denied
    </FilesMatch>
</Directory>

<Directory /app/storage>
    AllowOverride None
    Options -Indexes -ExecCGI
    <IfModule php_module>
        php_admin_flag engine off
    </IfModule>
    RemoveHandler .php .phtml .php3 .php4 .php5 .php7 .php8 .phps .pht .phar
    RemoveType .php .phtml .php3 .php4 .php5 .php7 .php8 .phps .pht .phar
    <FilesMatch "\.(php|phtml|php[0-9]|phps|pht|phar)$">
        SetHandler none
        ForceType text/plain
        Require all denied
    </FilesMatch>
</Directory>

<Directory /app/public/uploads>
    AllowOverride None
    Options -Indexes -ExecCGI
    <IfModule php_module>
        php_admin_flag engine off
    </IfModule>
    RemoveHandler .php .phtml .php3 .php4 .php5 .php7 .php8 .phps .pht .phar
    RemoveType .php .phtml .php3 .php4 .php5 .php7 .php8 .phps .pht .phar
    <FilesMatch "\.(php|phtml|php[0-9]|phps|pht|phar)$">
        SetHandler none
        ForceType text/plain
        Require all denied
    </FilesMatch>
</Directory>

<LocationMatch "^/(storage|uploads|files)/">
    <IfModule php_module>
        php_admin_flag engine off
    </IfModule>
    SetHandler none
</LocationMatch>

<LocationMatch "^/(storage|uploads|files)/.+\.(php|phtml|php[0-9]|phps|pht|phar)$">
    SetHandler none
    ForceType text/plain
    Require all denied
</LocationMatch>
